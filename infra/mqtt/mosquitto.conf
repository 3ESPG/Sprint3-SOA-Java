# Broker MQTT da telemetria Ford Retention AI — somente TLS com autenticação mútua (mTLS)
# Execute a partir desta pasta:  mosquitto -c mosquitto.conf

# Sem listener em texto puro: a porta 1883 não é aberta
listener 8883
protocol mqtt
cafile   certs/ford-iot-ca.crt
certfile certs/broker.crt
keyfile  certs/broker.key

# Versão mínima do TLS (1.3 também é aceito)
tls_version tlsv1.2

# Cliente sem certificado assinado pela CA da Ford é recusado já no handshake TLS
require_certificate true

# O CN do certificado (VIN do veículo) vira o usuário MQTT, usado na ACL
use_identity_as_username true
listener_allow_anonymous false

# Autorização por tópico
acl_file acl

# Limites contra abuso (DoS)
max_packet_size 16384
max_inflight_messages 20
max_queued_messages 100

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
