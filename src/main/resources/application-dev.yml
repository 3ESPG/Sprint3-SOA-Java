# Perfil de desenvolvimento: H2 em memória + carga do data.sql
spring:
  datasource:
    url: jdbc:h2:mem:fordretention;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8

logging:
  level:
    br.com.fiap.fordretention: DEBUG
