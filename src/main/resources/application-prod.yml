# Perfil de produção: Oracle. Todas as credenciais vêm de variáveis de ambiente.
spring:
  datasource:
    url: ${DB_URL}              # ex.: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # O Oracle da FIAP é compartilhado e limita sessões por usuário: pool pequeno
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    # Garante que as tabelas existam antes do script de carga
    defer-datasource-initialization: true
  sql:
    init:
      # DB_SEED=always carrega os dados de exemplo (o script só insere se o banco estiver vazio)
      mode: ${DB_SEED:never}
      data-locations: classpath:db/oracle/data.sql
      separator: /
      encoding: UTF-8

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: INFO
  structured:
    format:
      # JSON (formato Logstash) no console: pronto para Loki/Elastic/Azure Monitor.
      console: ${LOG_FORMAT:logstash}
