# Perfil de produção: Oracle. Todas as credenciais vêm de variáveis de ambiente.
spring:
  datasource:
    url: ${DB_URL}              # ex.: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  sql:
    init:
      mode: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: INFO
